apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
data:
  DETECTION_INFERENCE_CODE: "null"
  TRACKING_INFERENCE_CODE: "null"
  MAX_BATCH_SIZE: "4"
  BATCH_TIMEOUT: "2.0"
---
# ================= DETECTION STAGE =================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cell-detection
  template:
    metadata:
      labels:
        app: cell-detection
    spec:
      containers:
        - name: server
          image: biohub-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/workspace/server.py"]
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: STAGE_TYPE
              value: "detection"
            - name: INFERENCE_CODE
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: DETECTION_INFERENCE_CODE
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
              # Uncomment below once real GPU inference code is enabled (ensure replicas <= available GPUs):
              # nvidia.com/gpu: 1
          volumeMounts:
            - name: data-vol
              mountPath: /mnt/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data-vol
          hostPath:
            path: /mnt/data
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: detection-service
spec:
  clusterIP: None
  selector:
    app: cell-detection
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 8000
      targetPort: 8000
---
# ================= TRACKING STAGE =================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-tracking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cell-tracking
  template:
    metadata:
      labels:
        app: cell-tracking
    spec:
      containers:
        - name: server
          image: biohub-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/workspace/server.py"]
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: STAGE_TYPE
              value: "tracking"
            - name: INFERENCE_CODE
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: TRACKING_INFERENCE_CODE
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
              # Uncomment below once real GPU inference code is enabled:
              # nvidia.com/gpu: 1
          volumeMounts:
            - name: data-vol
              mountPath: /mnt/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data-vol
          hostPath:
            path: /mnt/data
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
spec:
  clusterIP: None
  selector:
    app: cell-tracking
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 8000
      targetPort: 8000
---
# ================= PROMETHEUS & GRAFANA =================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'biohub-pipeline'
        dns_sd_configs:
          - names:
              - 'detection-service.default.svc.cluster.local'
              - 'tracking-service.default.svc.cluster.local'
            type: 'A'
            port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prom-cfg
              mountPath: /etc/prometheus
      volumes:
        - name: prom-cfg
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
